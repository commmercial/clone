name: Copy profilo into clone

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/copy-profilo.yml

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out clone
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy profilo repository contents
        run: |
          git clone --depth 1 https://github.com/commmercial/profilo.git ../profilo-source
          rm -rf ../profilo-source/.git
          cp .github/workflows/copy-profilo.yml /tmp/copy-profilo.yml
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a ../profilo-source/. .
          rm -rf .github
          mkdir -p .github/workflows
          cp /tmp/copy-profilo.yml .github/workflows/copy-profilo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Copy profilo repository contents"
          git push origin HEAD:main
